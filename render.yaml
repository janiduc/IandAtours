# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + → Blueprint → pick this repository and the "main" branch.
# Values marked "sync: false" are asked for once when you create the Blueprint.
services:
  - type: web
    name: iandatours-api
    runtime: docker
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Free instances sleep after 15 minutes idle and take about a minute to wake.
    # Upgrade to a paid instance before taking real payments.
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: iandatours-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        sync: false # e.g. https://iandatours-web.onrender.com, or your own domain
      - key: API_URL
        sync: false # e.g. https://iandatours-api.onrender.com
      - key: CORS_ORIGINS
        sync: false # e.g. ["https://iandatours-web.onrender.com"]
      - key: PAYHERE_MERCHANT_ID
        sync: false
      - key: PAYHERE_MERCHANT_SECRET
        sync: false
      - key: PAYHERE_SANDBOX
        value: "true"
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: iandatours-web
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WHATSAPP_NUMBERS
        value: "94773974668,94773974669"
    # The website and API share one address, so the staff sign-in cookie stays first-party.
    # If Render gives the API a different address, update the destinations below.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://iandatours-api.onrender.com/api/*
      - type: rewrite
        source: /robots.txt
        destination: https://iandatours-api.onrender.com/robots.txt
      - type: rewrite
        source: /sitemap.xml
        destination: https://iandatours-api.onrender.com/sitemap.xml
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: iandatours-db
    # Free Render Postgres expires after 30 days and has no backups: fine for a trial,
    # but upgrade to a paid plan before real bookings arrive.
    plan: free
    databaseName: iandatours
    user: iandatours
